apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - db-service.yaml
  - db-statefulset.yaml
  - backend-service.yaml
  - backend-deployment.yaml
  - frontend-service.yaml
  - frontend-deployment.yaml

labels:
  - pairs:
      app.kubernetes.io/name: task-tracker
      app.kubernetes.io/managed-by: kustomize
    includeSelectors: false

configMapGenerator:
  - name: task-config
    literals:
      - DB_HOST=db-svc
      - DB_PORT=5432
      - DB_NAME=taskdb
      - POSTGRES_DB=taskdb
      - APP_PORT=8080
      - CORS_ORIGIN=*
      - BACKEND_URL=

secretGenerator:
  - name: task-credentials
    envs:
      - secret.env
    type: Opaque

generatorOptions:
  labels:
    app.kubernetes.io/part-of: task-tracker
