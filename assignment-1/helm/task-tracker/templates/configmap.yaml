apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "task-tracker.configMapName" . }}
  labels:
    {{- include "task-tracker.labels" . | nindent 4 }}
data:
  DB_HOST: {{ include "task-tracker.databaseServiceName" . | quote }}
  DB_PORT: {{ .Values.config.databasePort | quote }}
  DB_NAME: {{ .Values.config.databaseName | quote }}
  POSTGRES_DB: {{ .Values.config.databaseName | quote }}
  APP_PORT: {{ .Values.config.applicationPort | quote }}
  CORS_ORIGIN: {{ .Values.config.corsOrigin | quote }}
  BACKEND_URL: {{ .Values.config.backendUrl | quote }}
