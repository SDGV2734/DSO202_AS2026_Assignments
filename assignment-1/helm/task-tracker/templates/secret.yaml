{{- if .Values.credentials.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "task-tracker.credentialsSecretName" . }}
  labels:
    {{- include "task-tracker.labels" . | nindent 4 }}
type: Opaque
stringData:
  DB_USER: {{ required "credentials.username is required when credentials.create=true" .Values.credentials.username | quote }}
  DB_PASSWORD: {{ required "credentials.password is required when credentials.create=true" .Values.credentials.password | quote }}
  POSTGRES_USER: {{ required "credentials.username is required when credentials.create=true" .Values.credentials.username | quote }}
  POSTGRES_PASSWORD: {{ required "credentials.password is required when credentials.create=true" .Values.credentials.password | quote }}
{{- end }}
