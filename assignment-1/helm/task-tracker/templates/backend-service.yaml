apiVersion: v1
kind: Service
metadata:
  name: {{ include "task-tracker.backendServiceName" . }}
  labels:
    {{- include "task-tracker.labels" . | nindent 4 }}
    tier: backend
spec:
  type: ClusterIP
  selector:
    {{- include "task-tracker.selectorLabels" (dict "root" . "tier" "backend") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.backend.service.port }}
      targetPort: http
