apiVersion: v1
kind: Service
metadata:
  name: {{ include "task-tracker.frontendServiceName" . }}
  labels:
    {{- include "task-tracker.labels" . | nindent 4 }}
    tier: frontend
spec:
  type: {{ .Values.frontend.service.type }}
  selector:
    {{- include "task-tracker.selectorLabels" (dict "root" . "tier" "frontend") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.frontend.service.port }}
      targetPort: http
      {{- if and (eq .Values.frontend.service.type "NodePort") .Values.frontend.service.nodePort }}
      nodePort: {{ .Values.frontend.service.nodePort }}
      {{- end }}
